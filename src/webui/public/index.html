<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>civitai-downloader</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%236366f1'/%3E%3Cpath d='M9 22V10h5.2a4 4 0 0 1 0 8H12v4z' fill='%23fff'/%3E%3C/svg%3E" />
  </head>
  <body>
    <a class="skip" href="#view" data-i18n="web.a11y.skip">Skip to content</a>

    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">DL</span>
        <span class="brand-name">civitai-downloader</span>
        <span class="brand-version" id="app-version"></span>
      </div>
      <nav class="nav" id="nav" aria-label="main"></nav>
      <div class="topbar-right">
        <span class="pill" id="login-pill" hidden></span>
        <button class="icon-btn" id="lang-btn" type="button" title="language">中/EN</button>
        <button class="icon-btn" id="refresh-btn" type="button" title="refresh">⟳</button>
      </div>
    </header>

    <main id="view" class="view" tabindex="-1">
      <div class="loading">…</div>
    </main>

    <section id="job-drawer" class="job-drawer" hidden aria-live="polite">
      <div class="job-head">
        <span class="job-title" id="job-title"></span>
        <span class="job-status" id="job-status"></span>
        <span class="job-elapsed" id="job-elapsed"></span>
        <button class="small ghost" id="job-toggle" type="button" data-i18n="web.job.toggleLog">Log</button>
        <button class="small danger" id="job-cancel" type="button" data-i18n="web.job.cancel">Cancel</button>
      </div>
      <div class="job-progress" id="job-progress"></div>
      <div class="job-meta" id="job-meta"></div>
      <pre class="job-log" id="job-log" hidden></pre>
    </section>

    <div id="modal-root"></div>
    <div id="toasts" class="toasts" aria-live="polite"></div>

    <script src="/app.js"></script>
  </body>
</html>
