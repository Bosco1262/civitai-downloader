name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22, 24]
    env:
      CIVITAI_LANG: zh-CN
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Syntax check / 语法检查
        run: node scripts/check-syntax.js
      - name: Bilingual comments / 双语注释规范
        run: node scripts/check-comments.js
      - name: Unit and integration tests / 单元与集成测试
        run: npm test
